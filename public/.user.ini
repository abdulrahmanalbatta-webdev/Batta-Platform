; PHP upload limits for hosts that read .user.ini (PHP-FPM/CGI, e.g. alwaysdata); the dashboard accepts images up to 5MB.
upload_max_filesize = 10M
post_max_size = 12M

; Off until the host runs PHP 8.5.12+ (CVE-2026-109619); the dashboard does not use session upload progress.
session.upload_progress.enabled = Off
