name: server check (alwaysdata)

# Runs "php artisan app:health" on the alwaysdata account over SSH, with the password already saved for the
# deploy (secret ALWAYSDATA_SSH_PASSWORD), so nobody has to log in to Web SSH: Actions → server check → Run workflow.
# The output prints no secrets (this repository is public, and so are its Actions logs).
on:
  workflow_dispatch:
    inputs:
      retry_failed:
        description: 'Retry the failed jobs first (e.g. emails that failed before mail was set up)'
        type: boolean
        default: false

jobs:
  check:
    if: vars.ALWAYSDATA_ACCOUNT != ''
    runs-on: ubuntu-latest

    env:
      ACCOUNT: ${{ vars.ALWAYSDATA_ACCOUNT }}
      SSHPASS: ${{ secrets.ALWAYSDATA_SSH_PASSWORD }}

    steps:
      - name: Install sshpass
        run: sudo apt-get update -q && sudo apt-get install -yq sshpass

      - name: Check the platform
        env:
          RETRY: ${{ inputs.retry_failed && 'php artisan queue:retry all && php artisan queue:work --stop-when-empty --max-time=50 &&' || '' }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "${ACCOUNT}@ssh-${ACCOUNT}.alwaysdata.net" \
            "cd ~/batta && echo \"Version: \$(git rev-parse --short HEAD)\" && ${RETRY} php artisan app:health"
